name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: npm test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 22 is the minimum the README states; 24 is the current LTS.
        node: [22, 24]
    defaults:
      run:
        working-directory: TraceMap-catalog
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: TraceMap-catalog/package-lock.json

      - run: npm ci

      - run: npm test

      - name: Build the example catalog
        run: npm run build:example
