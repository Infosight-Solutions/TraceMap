<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northfield Systems, Inc. (fictional example company) · Compliance Catalog · TraceMap</title>
<style>
:root {
  --ground: #F3F4F1;
  --surface: #FFFFFF;
  --line: #D9DBD4;
  --line-soft: #E7E8E3;
  --ink: #1B2430;
  --ink-2: #333C48;
  --muted: #545C68;
  --navy: #1B3A5C;
  --navy-dark: #0F2440;
  --navy-tint: #E4ECF4;
  --amber: #C97A22;
  --amber-fill: #FBE9D0;
  --amber-ink: #7A3500;
  --red: #8E1B1B;
  --dash: #8A8F98;
  --soon: #9A4A00;
  --display: "Source Serif 4", "Source Serif Pro", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", Consolas, "SFMono-Regular", Menlo, monospace;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
}
a { color: var(--navy); text-underline-offset: 2px; }
a:hover { color: var(--navy-dark); }
:focus-visible { outline: 3px solid #3B7DD8; outline-offset: 2px; }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3 { margin: 0; line-height: 1.2; }
p { margin: 0; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
.visually-hidden {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}
.skip-link { position: absolute; left: -999px; top: 8px; background: #fff; padding: 8px 12px; z-index: 10; }
.skip-link:focus { left: 8px; }

/* ---------- chrome ---------- */
.topbar { background: var(--navy); color: #fff; }
.topbar-inner {
  max-width: 1320px; margin: 0 auto; padding: 16px 40px;
  display: flex; align-items: center; gap: 32px; flex-wrap: wrap;
}
.brand { color: #fff; text-decoration: none; display: flex; flex-direction: column; }
.brand:hover { color: #fff; }
.brand-title { font-family: var(--display); font-size: 24px; font-weight: 700; }
.brand-org { font-size: 14px; color: #D5DEE8; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
.nav a {
  color: #E6EDF5; text-decoration: none; padding: 8px 12px; border-radius: 8px; font-size: 15px;
}
.nav a:hover { background: rgba(255,255,255,0.1); color: #fff; }
.nav a[aria-current="page"] { background: #fff; color: var(--navy); font-weight: 600; }

.notice { background: var(--surface); border-bottom: 1px solid var(--line); }
.notice-inner {
  max-width: 1320px; margin: 0 auto; padding: 12px 40px;
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 15px;
}
.notice-meta { margin-left: auto; font-size: 14px; color: var(--muted); }
.sample-flag {
  font-size: 13px; font-weight: 600; color: var(--amber-ink); background: var(--amber-fill);
  border: 1px solid var(--amber); border-radius: 999px; padding: 3px 12px;
}

main { max-width: 1320px; margin: 0 auto; padding: 40px 40px 72px; display: flex; flex-direction: column; gap: 56px; }
.footer { border-top: 1px solid var(--line); }
.footer-inner {
  max-width: 1320px; margin: 0 auto; padding: 20px 40px 32px;
  display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; font-size: 13px; color: var(--muted);
}

.crumbs { display: flex; gap: 10px; flex-wrap: wrap; font-size: 15px; color: var(--muted); margin-bottom: -24px; }

/* ---------- type ---------- */
.page-title { font-family: var(--display); font-size: 46px; font-weight: 700; line-height: 1.08; }
.section-title { font-family: var(--display); font-size: 30px; font-weight: 700; }
.lede { font-size: 19px; line-height: 1.55; color: var(--ink-2); max-width: 72ch; }
.section-intro { font-size: 16px; color: var(--muted); max-width: 80ch; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.kicker { font-size: 14px; font-weight: 600; color: var(--muted); }

/* ---------- surfaces ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px 28px; }
.panel-tight { padding: 18px 22px; }
.panel h2 { font-size: 20px; font-weight: 600; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 40px; align-items: start; }

/* ---------- search ---------- */
.search { display: flex; gap: 12px; max-width: 820px; }
.search input {
  flex: 1; height: 50px; padding: 0 16px; font: inherit; font-size: 17px;
  border: 1px solid #A9A69C; border-radius: 10px; background: #fff; color: var(--ink);
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px; border-radius: 10px; font-weight: 600; font-size: 15px;
  border: 1px solid var(--navy); background: #fff; color: var(--navy); text-decoration: none;
}
.btn:hover { background: var(--navy-tint); color: var(--navy-dark); }
.btn-primary { background: var(--navy); color: #fff; }
.btn-primary:hover { background: var(--navy-dark); color: #fff; }
.btn-small { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 8px; }
.linkbtn { background: none; border: none; padding: 0; color: var(--navy); text-decoration: underline; font-size: 15px; }

/* ---------- applicability ---------- */
.applies { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 32px; }
.check {
  display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border-radius: 10px;
  border: 1px solid transparent; cursor: pointer;
}
.check:hover { background: #F7F8F5; border-color: var(--line-soft); }
.check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--navy); flex-shrink: 0; }
.check-label { font-weight: 500; }
.check-help { display: block; font-size: 14px; color: var(--muted); }

/* ---------- chips / facets ---------- */
.facets { display: flex; flex-direction: column; gap: 16px; }
.facet { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 16px; align-items: center; }
.facet-label { font-size: 14px; font-weight: 600; color: var(--ink-2); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 36px; padding: 6px 14px; border-radius: 999px; font-size: 14px;
  border: 1px solid #A9A69C; background: #fff; color: var(--ink);
}
.chip:hover { border-color: var(--navy); }
.chip[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; font-weight: 600; }
.chip:disabled { color: #9A9EA5; border-color: var(--line-soft); background: #F7F7F4; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid #A9A69C; border-radius: 8px; overflow: hidden; }
.seg button { border: none; background: #fff; padding: 6px 14px; font-size: 14px; min-height: 36px; }
.seg button + button { border-left: 1px solid #A9A69C; }
.seg button[aria-pressed="true"] { background: var(--navy); color: #fff; font-weight: 600; }

/* ---------- tags ---------- */
.tag {
  display: inline-block; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 6px;
  background: var(--navy-tint); color: var(--navy);
}
.tag-soon { background: var(--soon); color: #fff; }
.tag-quiet { background: #ECEDE8; color: var(--ink-2); }
.tag-restricted { background: #F1E4E4; color: var(--red); }

/* ---------- status ---------- */
.pill {
  align-self: flex-start;
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px;
  font-size: 13px; font-weight: 600; white-space: nowrap; border: 1px solid transparent;
}
.st-verified { background: var(--navy); color: #fff; border-color: var(--navy); }
.st-deviations_noted { background: var(--amber-fill); color: var(--amber-ink); border-color: var(--amber); }
.st-verification_pending { background: #fff; color: var(--red); border: 2px solid var(--red); }
.st-not_assessed { background: #EEEDE8; color: var(--ink-2); border: 1px dashed var(--dash); }
.st-context { background: #fff; color: var(--muted); border: 1px solid var(--line); }
.overdue { font-size: 13px; font-weight: 600; color: var(--red); }

.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: #E3E1DA; min-width: 120px; }
.bar-lg { height: 12px; border-radius: 6px; }
.bar span { display: block; height: 100%; }
.bar .b-verified { background: var(--navy); }
.bar .b-deviations_noted { background: #D98B2B; }
.bar .b-verification_pending { background: var(--red); }
.legend { display: flex; gap: 24px; flex-wrap: wrap; font-size: 14px; color: var(--ink-2); }
.legend span.swatch { display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-right: 8px; vertical-align: -2px; }

.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; }
.stat-num { font-size: 32px; font-weight: 600; line-height: 1.1; }
.stat-label { font-size: 14px; color: var(--ink-2); }
.stat.k-verified { border-top: 5px solid var(--navy); }
.stat.k-deviations_noted { border-top: 5px solid #D98B2B; }
.stat.k-verification_pending { border-top: 5px solid var(--red); }
.stat.k-not_assessed { border-top: 5px dashed var(--dash); }

/* ---------- cards ---------- */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
.tile {
  display: flex; flex-direction: column; gap: 8px; padding: 20px 22px; min-height: 150px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; color: var(--ink); text-decoration: none;
}
.tile:hover { border-color: var(--navy); color: var(--ink); }
.tile-name { font-size: 18px; font-weight: 600; line-height: 1.3; }
.tile-blurb { font-size: 15px; color: var(--muted); flex: 1; }
.tile-count { font-size: 14px; font-weight: 600; color: var(--navy); }
.tile-empty { opacity: 0.6; }

.date-card { display: flex; flex-direction: column; gap: 6px; }
.date-card .when { font-weight: 600; }

/* ---------- tables ---------- */
.table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th {
  text-align: left; font-size: 13px; font-weight: 600; color: var(--ink-2); background: #EDEEE9;
  padding: 12px 16px; white-space: nowrap;
}
td { padding: 14px 16px; border-top: 1px solid var(--line-soft); vertical-align: top; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: #F7F9FB; }
tr.selected td { background: var(--navy-tint); }
tr.group td { background: #F7F8F5; font-weight: 600; padding: 12px 16px; }
td .sub { display: block; font-size: 13px; color: var(--muted); font-weight: 400; }
.wording { border-left: 3px solid var(--line); padding-left: 12px; color: var(--ink-2); }
.wording-note { font-size: 13px; color: var(--muted); }
.version-note { font-size: 13px; color: var(--amber-ink); }
.docs-list { display: flex; flex-direction: column; gap: 6px; }
.doc-link { display: flex; flex-direction: column; text-decoration: none; }
.doc-link .doc-id { font-family: var(--mono); font-size: 13px; text-decoration: underline; }
.doc-link .doc-title { font-size: 13px; color: var(--ink-2); }

/* ---------- requirement cards ---------- */
.req { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.req-head { padding: 22px 26px 18px; display: flex; justify-content: space-between; gap: 24px; }
.req-head h3 { font-size: 22px; font-weight: 600; }
.req-head p { color: var(--ink-2); margin-top: 6px; max-width: 80ch; }
.req table { border-top: 1px solid var(--line-soft); }

/* ---------- traceability ---------- */
.trace { display: grid; grid-template-columns: repeat(var(--layers, 4), minmax(0, 1fr)); gap: 14px; }
.layer { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.layer-empty { border-style: dashed; border-color: var(--dash); background: #F4F3EF; }
.layer-name { font-size: 14px; font-weight: 600; color: var(--muted); }
.detail {
  background: var(--surface); border: 2px solid var(--navy); border-radius: 14px; padding: 24px 28px;
  display: flex; flex-direction: column; gap: 18px;
}

.callout {
  background: #FFF8EE; border: 1px solid #D98B2B; border-radius: 12px; padding: 18px 22px;
  display: flex; gap: 14px; align-items: flex-start;
}
.callout strong { color: #5C2800; }

.checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.checklist li { display: flex; gap: 10px; align-items: flex-start; }
.checklist svg { flex-shrink: 0; margin-top: 3px; }

/* ---------- timeline ---------- */
.tl { display: flex; flex-direction: column; }
.tl-item { display: grid; grid-template-columns: 130px 22px minmax(0, 1fr); gap: 12px; }
.tl-date { font-size: 15px; color: var(--ink-2); font-weight: 500; padding-top: 1px; }
.tl-item.future .tl-date { color: var(--soon); font-weight: 700; }
.tl-rail { display: flex; flex-direction: column; align-items: center; }
.tl-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--navy); margin-top: 4px; flex-shrink: 0; }
.tl-item.future .tl-dot { background: #fff; border: 3px solid var(--soon); }
.tl-line { flex: 1; width: 2px; background: var(--line); margin-top: 4px; }
.tl-body { padding-bottom: 18px; }
.tl-body .t { font-weight: 600; }
.tl-body .d { font-size: 14px; color: var(--ink-2); }
.tl-year { font-family: var(--display); font-size: 22px; font-weight: 700; margin: 12px 0 10px; }

/* ---------- crosswalk ---------- */
.xw th.reg { white-space: normal; min-width: 130px; vertical-align: bottom; }
.xw td.cell { text-align: left; }
.xw .cell-id { font-family: var(--mono); font-size: 13px; white-space: nowrap; }
.xw .dotmark { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.dm-verified { background: var(--navy); }
.dm-deviations_noted { background: #D98B2B; }
.dm-verification_pending { background: var(--red); }
.dm-not_assessed { background: #fff; border: 1px dashed var(--dash); }

abbr.term { text-decoration: underline dotted; text-underline-offset: 3px; cursor: help; }
.empty { padding: 28px; text-align: center; color: var(--muted); }
.glossary dt { font-weight: 600; margin-top: 16px; }
.glossary dd { margin: 4px 0 0; color: var(--ink-2); max-width: 80ch; }

@media (max-width: 1100px) {
  .tiles, .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .split, .grid-2 { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .trace { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 700px) {
  .topbar-inner, .notice-inner, main, .footer-inner { padding-left: 18px; padding-right: 18px; }
  .tiles, .grid-3, .grid-4, .applies, .trace { grid-template-columns: minmax(0, 1fr); }
  .facet { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .page-title { font-size: 34px; }
  .search { flex-direction: column; }
}
@media print {
  .topbar .nav, .search, .facets, .btn, .skip-link { display: none !important; }
  body { background: #fff; }
  .panel, .table-wrap, .req, .tile { break-inside: avoid; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

</style>
</head>

it_ops","name":"IT Operations Manager"}],"documents":[{"id":"REF-SOC2","title":"SOC 2 in plain language","doc_type":"reference","url":"https://docs.example.com/compliance/reference/soc2"},{"id":"REF-ISO27001","title":"ISO/IEC 27001 in plain language","doc_type":"reference","url":"https://docs.example.com/compliance/reference/iso27001"},{"id":"REF-CSF","title":"NIST CSF 2.0 in plain language","doc_type":"reference","url":"https://docs.example.com/compliance/reference/nist-csf"},{"id":"REF-GDPR","title":"GDPR in plain language","doc_type":"reference","url":"https://docs.example.com/compliance/reference/gdpr"},{"id":"REF-SEC","title":"SEC cybersecurity disclosure rule in plain language","doc_type":"reference","url":"https://docs.example.com/compliance/reference/sec-cyber"},{"id":"POL-001","title":"Information Security Policy","layer":"policy","doc_type":"Policy","revision":"Rev 3","date_filed":"2026-01-20","last_reviewed":"2026-01-20","url":"https://docs.example.com/policies/POL-001"},{"id":"POL-002","title":"Access Control Policy","layer":"policy","doc_type":"Policy","revision":"Rev 2","date_filed":"2025-11-04","last_reviewed":"2025-11-04","url":"https://docs.example.com/policies/POL-002"},{"id":"POL-003","title":"Data Protection Policy","layer":"policy","doc_type":"Policy","revision":"Rev 2","date_filed":"2026-02-12","last_reviewed":"2026-02-12","url":"https://docs.example.com/policies/POL-003"},{"id":"POL-004","title":"Data Retention and Deletion Policy","layer":"policy","doc_type":"Policy","revision":"Rev 1","date_filed":"2025-04-30","last_reviewed":"2025-04-30","url":"https://docs.example.com/policies/POL-004"},{"id":"POL-005","title":"Board Cybersecurity Oversight Charter","layer":"policy","doc_type":"Charter","revision":"Rev 1","date_filed":"2024-03-18","last_reviewed":"2026-03-02","review_interval_days":730,"url":"https://docs.example.com/governance/POL-005","restricted":true},{"id":"STD-001","title":"Encryption Standard","layer":"standard","doc_type":"Standard","revision":"Rev 2","date_filed":"2025-09-15","last_reviewed":"2025-09-15","url":"https://docs.example.com/standards/STD-001"},{"id":"STD-002","title":"Logging and Monitoring Standard","layer":"standard","doc_type":"Standard","revision":"Rev 1","date_filed":"2026-05-06","last_reviewed":"2026-05-06","url":"https://docs.example.com/standards/STD-002"},{"id":"STD-003","title":"Authentication and MFA Standard","layer":"standard","doc_type":"Standard","revision":"Rev 1","date_filed":"2025-03-10","last_reviewed":"2025-03-10","url":"https://docs.example.com/standards/STD-003"},{"id":"PRC-001","title":"Incident Response Plan","layer":"procedure","doc_type":"Plan","revision":"Rev 4","date_filed":"2026-04-01","last_reviewed":"2026-04-01","url":"https://docs.example.com/procedures/PRC-001"},{"id":"PRC-002","title":"Personal Data Breach Notification Procedure","layer":"procedure","doc_type":"Procedure","revision":"Rev 1","date_filed":"2026-02-12","last_reviewed":"2026-02-12","url":"https://docs.example.com/procedures/PRC-002"},{"id":"PRC-003","title":"Vendor Security Review Procedure","layer":"procedure","doc_type":"Procedure","revision":"Rev 2","date_filed":"2025-12-01","last_reviewed":"2025-12-01","url":"https://docs.example.com/procedures/PRC-003"},{"id":"PRC-004","title":"Quarterly Access Review Procedure","layer":"procedure","doc_type":"Procedure","revision":"Rev 1","date_filed":"2025-11-04","last_reviewed":"2025-11-04","url":"https://docs.example.com/procedures/PRC-004"},{"id":"PRC-005","title":"Cyber Incident Materiality Assessment Procedure","layer":"procedure","doc_type":"Procedure","status_note":"Drafting. Target filing Q4 2026."},{"id":"EVD-001","title":"Q2 2026 Access Review Record","layer":"evidence","doc_type":"Record","date_filed":"2026-07-08","valid_until":"2027-01-08","url":"https://docs.example.com/evidence/EVD-001","attributes":[{"name":"Accounts reviewed","value":"214"}]},{"id":"EVD-002","title":"2026 Incident Response Tabletop Report","layer":"evidence","doc_type":"Report","date_filed":"2026-05-20","url":"https://docs.example.com/evidence/EVD-002","restricted":true},{"id":"EVD-003","title":"Vendor Review Log","layer":"evidence","doc_type":"Log","date_filed":"2026-08-29","url":"https://docs.example.com/evidence/EVD-003"}],"regulations":[{"id":"soc2","name":"SOC 2","full_title":"AICPA Trust Services Criteria (SOC 2 examination)","reg_document":"REF-SOC2","source_type":"standard","obligation_type":"certified_to","category":"security_framework","jurisdiction":"us","scope":"program","applies_if":["customer_assurance"],"accountable_role":"ciso","condition":"When customers require it","version_tracked":"2017 Trust Services Criteria with 2022 revised points of focus","wording_note":"Summary. The official criteria text is published by the AICPA and not reproduced here.","source_url":"https://www.aicpa-cima.com/","total_obligations":33,"summary":"An independent auditor's report on how well a company protects the systems and data it handles for customers. It is not a law, but many customers will not sign a contract without one.\n","applies_when":["Customers or prospects ask for a SOC 2 report during security review","We store or process data on behalf of customers"],"does_not_apply":["No law requires SOC 2. It applies only when customers or contracts ask for it.","This catalog tracks the Security criteria (the 33 common criteria) only."],"date_display":"Criteria current since 2017","key_dates":[{"date":"2017-01-01","date_text":"2017","label":"Current Trust Services Criteria issued"},{"date":"2022-01-01","date_text":"2022","label":"Revised points of focus published"},{"date":"2027-03-31","label":"Type II observation period ends","detail":"Internal milestone. The auditor tests controls over this period.","kind":"internal"}],"last_reviewed":"2026-06-15","attributes":[{"name":"Observation period","value":"12","unit":"months","source":"AICPA SOC 2 guide"}]},{"id":"iso27001","name":"ISO/IEC 27001:2022","full_title":"Information security management systems, requirements","reg_document":"REF-ISO27001","source_type":"standard","obligation_type":"certified_to","category":"security_framework","jurisdiction":"international","scope":"program","applies_if":["certification"],"accountable_role":"ciso","condition":"If certifying","version_tracked":"ISO/IEC 27001:2022","wording_note":"Summary. The official text is licensed by ISO and not reproduced here.","source_url":"https://www.iso.org/standard/27001","total_obligations":93,"summary":"The international standard for running an information security program. Certification means an accredited auditor has confirmed the program meets the standard.\n","applies_when":["We want certification to satisfy international customers or tenders","A contract requires ISO 27001 certification"],"does_not_apply":["ISO 27001 is voluntary. Without certification plans, it is still useful as a reference but nothing is audited.","This catalog counts the 93 Annex A controls. The management clauses (4 to 10) are tracked separately."],"key_dates":[{"date":"2022-10-25","label":"2022 edition published"},{"date":"2025-10-31","label":"Certificates to the 2013 edition expire","detail":"Organizations certified to the old edition had to transition by this date."},{"date":"2027-02-15","label":"Certification audit, stage 2","detail":"Internal milestone.","kind":"internal"}],"last_reviewed":"2026-06-15"},{"id":"nist-csf","name":"NIST Cybersecurity Framework 2.0","full_title":"The NIST Cybersecurity Framework (CSF) 2.0","reg_document":"REF-CSF","source_type":"guidance","obligation_type":"aligned_with","category":"security_framework","jurisdiction":"us","scope":"program","applies_if":"always","accountable_role":"ciso","version_tracked":"CSF 2.0 (February 2024)","source_url":"https://www.nist.gov/cyberframework","total_obligations":106,"summary":"A free, widely used framework from the US government that organizes security work into six functions: Govern, Identify, Protect, Detect, Respond, and Recover. It is voluntary, and many companies use it as their baseline.\n","applies_when":["We use the CSF as the common language for describing our security program"],"does_not_apply":["The CSF is voluntary for private companies. Nothing is certified against it."],"key_dates":[{"date":"2024-02-26","label":"CSF 2.0 published"}],"last_reviewed":"2025-08-01"},{"id":"gdpr","name":"GDPR","full_title":"General Data Protection Regulation (EU) 2016/679","reg_document":"REF-GDPR","source_type":"mandate","obligation_type":"compliant_with","category":"privacy","jurisdiction":"eu","scope":"data","applies_if":["eu_personal_data"],"accountable_role":"dpo","condition":"EU personal data","version_tracked":"Regulation (EU) 2016/679 as in force","source_url":"https://eur-lex.europa.eu/eli/reg/2016/679/oj","summary":"The EU's data protection law. It sets rules for collecting, using, keeping, and protecting personal data about people in the EU, and applies to companies outside the EU that serve them.\n","applies_when":["We offer goods or services to people in the EU, including free services","We monitor the behavior of people in the EU, for example through website analytics","We have an office or employees in the EU"],"does_not_apply":["Data that is truly anonymized and can no longer identify anyone","Purely personal or household activity"],"key_dates":[{"date":"2016-04-27","label":"Regulation adopted"},{"date":"2018-05-25","label":"Regulation applies"}],"last_reviewed":"2026-03-10"},{"id":"sec-cyber","name":"SEC cybersecurity disclosure rule","full_title":"Cybersecurity Risk Management, Strategy, Governance, and Incident Disclosure","reg_document":"REF-SEC","source_type":"mandate","obligation_type":"compliant_with","category":"securities","jurisdiction":"us","scope":"both","applies_if":["us_public"],"accountable_role":"general_counsel","condition":"Public companies","wording_note":"Summary of the rule's requirements. See the official source for the exact text.","source_url":"https://www.sec.gov/","summary":"Public companies must report a material cybersecurity incident within four business days of deciding it is material, and describe how they manage cyber risk and how the board oversees it in every annual report.\n","applies_when":["Our shares are registered with the SEC"],"does_not_apply":["Private companies"],"key_dates":[{"date":"2023-07-26","label":"Rule adopted"},{"date":"2023-09-05","label":"Rule effective"},{"date":"2023-12-15","label":"Annual report disclosures begin","detail":"For fiscal years ending on or after this date."},{"date":"2023-12-18","label":"Incident reporting on Form 8-K begins","detail":"Smaller reporting companies began June 15, 2024."}],"last_reviewed":"2026-03-10"}],"topics":[{"id":"access","name":"Who can access what","blurb":"Deciding who gets an account and limiting each person to what their job needs.","summary":"Only the right people should be able to see or change company and customer data, and only as much as their job needs. This covers creating accounts, granting permissions, reviewing them, and removing access when someone leaves or changes roles.\n","applies_to_you":["Adding a new hire or contractor to a system","Giving someone administrator rights","Approving a request for access to customer data","Offboarding someone or changing their role"],"related":["identity","logging"]},{"id":"identity","name":"Proving who someone is","blurb":"Passwords, multi-factor authentication, and service accounts.","summary":"Before a system grants access, it needs to be confident the person or program is who they claim to be. This covers login rules, MFA, and accounts used by software rather than people.\n","applies_to_you":["Setting up login for a new application","Creating a service account or API key","Asking for an exception to MFA"],"related":["access"]},{"id":"data-protection","name":"Protecting stored and transferred data","blurb":"Encryption and other safeguards for data at rest and in transit.","summary":"Data should be unreadable to anyone who gets hold of it without permission, whether it is stored on a disk or moving across a network.\n","applies_to_you":["Choosing where to store customer data","Sending files to a customer or partner","Setting up a new database or storage bucket"],"related":["personal-info","access"]},{"id":"logging","name":"Keeping activity records","blurb":"Logging who did what, and watching for unusual activity.","summary":"Systems should record important activity so problems can be spotted and investigated later. This covers what gets logged, how long logs are kept, and who reviews them.\n","applies_to_you":["Launching a new system or application","Investigating something that looks wrong"],"related":["incidents"]},{"id":"incidents","name":"When something goes wrong","blurb":"Responding to security incidents and telling the right people in time.","summary":"When a security incident happens, the company needs a plan for containing it and, in some cases, a legal deadline for telling regulators, investors, or the people affected.\n","applies_to_you":["You notice a lost laptop, a phishing click, or unexpected access","You are part of the incident response team","You approve public statements or regulatory filings"],"related":["logging","personal-info"]},{"id":"vendors","name":"Vendors, contractors, and partners","blurb":"What we check before a supplier touches our data, and after.","summary":"Suppliers who handle our data or connect to our systems can create risk for us. We check their security before signing and keep checking while we work with them.\n","applies_to_you":["Buying a new software service","Hiring a contractor who needs system access","Renewing a supplier contract"],"related":["personal-info"]},{"id":"personal-info","name":"Personal information about people","blurb":"Names, contact details, and other data covered by privacy laws.","summary":"Privacy laws give people rights over data about them and put limits on what companies can do with it. This covers knowing what personal data we hold and answering people's requests.\n","applies_to_you":["Collecting data about customers, users, or employees","Receiving a request from someone asking what data we hold about them"],"related":["data-protection","retention"]},{"id":"retention","name":"Keeping and deleting data","blurb":"How long we keep data, and deleting it when it is no longer needed.","summary":"Data should be kept only as long as it is needed and then deleted properly. Keeping data forever increases the damage if it is ever exposed.\n","applies_to_you":["Closing out a customer account or project","Decommissioning a system","Receiving a request to delete someone's data"],"related":["personal-info"]},{"id":"oversight","name":"Leadership and oversight","blurb":"What executives and the board are responsible for.","summary":"Senior leaders and the board are expected to understand the company's cybersecurity risk, decide how to handle it, and be able to show they are overseeing it.\n","applies_to_you":["Preparing a board or executive update on security","Drafting the annual report"],"related":["incidents"]}],"controls":[{"id":"access-lifecycle","topic":"access","name":"Create, review, and remove accounts on purpose","summary":"Every account has an owner and a reason to exist. Accounts are approved before they are created, reviewed on a schedule, and removed promptly when no longer needed.\n"},{"id":"least-privilege","topic":"access","name":"Give people only the access their job needs","summary":"People and programs get the minimum access needed for their work. Administrator rights are limited to the few who need them.\n"},{"id":"authentication","topic":"identity","name":"Confirm identity before granting access","summary":"Users and systems prove who they are before getting in, using multi-factor authentication wherever the risk justifies it.\n"},{"id":"encryption","topic":"data-protection","name":"Encrypt data when it is stored and when it moves","summary":"Sensitive data is encrypted on disk and across networks, and encryption keys are managed so that only authorized systems can use them.\n"},{"id":"logging","topic":"logging","name":"Record important activity and watch for problems","summary":"Systems log security-relevant events, the logs are protected from tampering, and someone reviews them for signs of trouble.\n"},{"id":"incident-response","topic":"incidents","name":"Have an incident plan and use it","summary":"Roles, steps, and contacts for handling an incident are written down before anything happens, and the plan is practiced.\n"},{"id":"breach-notification","topic":"incidents","name":"Tell regulators, investors, and affected people on time","summary":"Some incidents must be reported within fixed deadlines. The company knows who decides, who files, and how fast.\n"},{"id":"vendor-risk","topic":"vendors","name":"Check suppliers before and during the relationship","summary":"Suppliers who handle our data are reviewed before contracts are signed, contracts include security terms, and the review is repeated over time.\n"},{"id":"retention","topic":"retention","name":"Keep data only as long as needed","summary":"Each type of data has a retention period, and data is deleted or anonymized when that period ends or when someone has the right to have it erased.\n"},{"id":"risk-management","topic":"oversight","name":"Assess and manage cybersecurity risk","summary":"The company has a repeatable way to identify its cybersecurity risks, judge how serious they are, and decide what to do about them.\n"},{"id":"leadership","topic":"oversight","name":"Leadership oversees cybersecurity","summary":"Executives and the board have defined responsibilities for cybersecurity and receive regular reports on it.\n"}],"obligations":[{"id":"soc2-cc1-2","regulation_id":"soc2","control_id":"CC1.2","family":"CC1 Control environment","title":"Board oversight","text":"The board of directors is independent of management and oversees internal control.","official_wording":false,"common_control":"leadership","accountable_role":"general_counsel"},{"id":"soc2-cc3-2","regulation_id":"soc2","control_id":"CC3.2","family":"CC3 Risk assessment","title":"Risk identification and analysis","text":"Risks to achieving objectives are identified and analyzed to decide how they should be managed.","official_wording":false,"common_control":"risk-management","accountable_role":"ciso"},{"id":"soc2-cc6-1","regulation_id":"soc2","control_id":"CC6.1","family":"CC6 Logical and physical access","title":"Logical access security","text":"Access security software, infrastructure, and architecture protect information assets, including identifying and authenticating users.","official_wording":false,"common_control":"authentication","accountable_role":"it_ops"},{"id":"soc2-cc6-2","regulation_id":"soc2","control_id":"CC6.2","family":"CC6 Logical and physical access","title":"User registration and removal","text":"New users are registered and authorized before credentials are issued, and credentials are removed when access is no longer needed.","official_wording":false,"common_control":"access-lifecycle","accountable_role":"it_ops"},{"id":"soc2-cc6-3","regulation_id":"soc2","control_id":"CC6.3","family":"CC6 Logical and physical access","title":"Role-based access","text":"Access to data, software, and systems is authorized, changed, or removed based on roles, applying least privilege and segregation of duties.","official_wording":false,"common_control":"least-privilege","accountable_role":"it_ops"},{"id":"soc2-cc6-7","regulation_id":"soc2","control_id":"CC6.7","family":"CC6 Logical and physical access","title":"Protecting data in transmission","text":"The movement of information is restricted to authorized parties and protected while in transit.","official_wording":false,"common_control":"encryption","accountable_role":"it_ops"},{"id":"soc2-cc7-2","regulation_id":"soc2","control_id":"CC7.2","family":"CC7 System operations","title":"Monitoring for anomalies","text":"System components are monitored for anomalies that could indicate malicious acts, natural disasters, or errors.","official_wording":false,"common_control":"logging","accountable_role":"it_ops"},{"id":"soc2-cc7-4","regulation_id":"soc2","control_id":"CC7.4","family":"CC7 System operations","title":"Incident response","text":"Identified security incidents are responded to through a defined incident response program.","official_wording":false,"common_control":"incident-response","accountable_role":"ciso"},{"id":"soc2-cc9-2","regulation_id":"soc2","control_id":"CC9.2","family":"CC9 Risk mitigation","title":"Vendor and partner risk","text":"Risks from vendors and business partners are assessed and managed.","official_wording":false,"common_control":"vendor-risk","accountable_role":"ciso"},{"id":"iso-5-1","regulation_id":"iso27001","control_id":"5.1","family":"Clause 5 Leadership","title":"Leadership and commitment","text":"Top management demonstrates leadership and commitment to the information security management system.","official_wording":false,"common_control":"leadership","accountable_role":"ciso"},{"id":"iso-6-1-2","regulation_id":"iso27001","control_id":"6.1.2","family":"Clause 6 Planning","title":"Information security risk assessment","text":"A repeatable information security risk assessment process is defined and applied.","official_wording":false,"common_control":"risk-management","accountable_role":"ciso"},{"id":"iso-a-5-18","regulation_id":"iso27001","control_id":"A.5.18","family":"Annex A.5 Organizational controls","title":"Access rights","text":"Access rights are provided, reviewed, adjusted, and removed in line with the access control policy.","official_wording":false,"common_control":"access-lifecycle","accountable_role":"it_ops"},{"id":"iso-a-5-19","regulation_id":"iso27001","control_id":"A.5.19","family":"Annex A.5 Organizational controls","title":"Information security in supplier relationships","text":"Processes are defined to manage security risks from the use of suppliers' products and services.","official_wording":false,"common_control":"vendor-risk","accountable_role":"ciso"},{"id":"iso-a-5-24","regulation_id":"iso27001","control_id":"A.5.24","family":"Annex A.5 Organizational controls","title":"Incident management planning and preparation","text":"Roles, responsibilities, and processes for managing security incidents are defined and prepared in advance.","official_wording":false,"common_control":"incident-response","accountable_role":"ciso"},{"id":"iso-a-8-2","regulation_id":"iso27001","control_id":"A.8.2","family":"Annex A.8 Technological controls","title":"Privileged access rights","text":"Privileged access rights are restricted and managed.","official_wording":false,"common_control":"least-privilege","accountable_role":"it_ops"},{"id":"iso-a-8-5","regulation_id":"iso27001","control_id":"A.8.5","family":"Annex A.8 Technological controls","title":"Secure authentication","text":"Secure authentication methods are used, based on access restrictions and the access control policy.","official_wording":false,"common_control":"authentication","accountable_role":"it_ops"},{"id":"iso-a-8-10","regulation_id":"iso27001","control_id":"A.8.10","family":"Annex A.8 Technological controls","title":"Information deletion","text":"Information is deleted when it is no longer required.","official_wording":false,"common_control":"retention","accountable_role":"it_ops"},{"id":"iso-a-8-15","regulation_id":"iso27001","control_id":"A.8.15","family":"Annex A.8 Technological controls","title":"Logging","text":"Logs recording activities, exceptions, and faults are produced, stored, protected, and analyzed.","official_wording":false,"common_control":"logging","accountable_role":"it_ops"},{"id":"iso-a-8-24","regulation_id":"iso27001","control_id":"A.8.24","family":"Annex A.8 Technological controls","title":"Use of cryptography","text":"Rules for the effective use of cryptography, including key management, are defined and followed.","official_wording":false,"common_control":"encryption","accountable_role":"ciso"},{"id":"csf-gv-rr-01","regulation_id":"nist-csf","control_id":"GV.RR-01","family":"Govern (GV)","title":"Leadership accountability","text":"Leadership is responsible and accountable for cybersecurity risk and builds a risk-aware, ethical, continually improving culture.","official_wording":false,"wording_note":"Summary of the CSF subcategory. See the official source for the exact text.","common_control":"leadership","accountable_role":"ciso"},{"id":"csf-gv-sc-07","regulation_id":"nist-csf","control_id":"GV.SC-07","family":"Govern (GV)","title":"Supplier risk throughout the relationship","text":"Risks posed by suppliers and other third parties are understood, recorded, prioritized, assessed, responded to, and monitored over the course of the relationship.","official_wording":false,"wording_note":"Summary of the CSF subcategory. See the official source for the exact text.","common_control":"vendor-risk","accountable_role":"ciso"},{"id":"csf-id-ra","regulation_id":"nist-csf","control_id":"ID.RA","family":"Identify (ID)","title":"Risk assessment","text":"The organization understands the cybersecurity risk to its operations, assets, and people.","official_wording":false,"wording_note":"Summary of the CSF category. See the official source for the exact text.","common_control":"risk-management","accountable_role":"ciso"},{"id":"csf-pr-aa-01","regulation_id":"nist-csf","control_id":"PR.AA-01","family":"Protect (PR)","title":"Identities and credentials are managed","text":"Identities and credentials for authorized users, services, and hardware are managed by the organization.","common_control":"access-lifecycle","accountable_role":"it_ops"},{"id":"csf-pr-aa-03","regulation_id":"nist-csf","control_id":"PR.AA-03","family":"Protect (PR)","title":"Authentication","text":"Users, services, and hardware are authenticated.","common_control":"authentication","accountable_role":"it_ops"},{"id":"csf-pr-aa-05","regulation_id":"nist-csf","control_id":"PR.AA-05","family":"Protect (PR)","title":"Access permissions and least privilege","text":"Access permissions, entitlements, and authorizations are defined in a policy, managed, enforced, and reviewed, and incorporate the principles of least privilege and separation of duties.","common_control":"least-privilege","accountable_role":"it_ops"},{"id":"csf-pr-ds-01","regulation_id":"nist-csf","control_id":"PR.DS-01","family":"Protect (PR)","title":"Data at rest is protected","text":"The confidentiality, integrity, and availability of data-at-rest are protected.","common_control":"encryption","accountable_role":"it_ops"},{"id":"csf-pr-ds-02","regulation_id":"nist-csf","control_id":"PR.DS-02","family":"Protect (PR)","title":"Data in transit is protected","text":"The confidentiality, integrity, and availability of data-in-transit are protected.","common_control":"encryption","accountable_role":"it_ops"},{"id":"csf-pr-ps-04","regulation_id":"nist-csf","control_id":"PR.PS-04","family":"Protect (PR)","title":"Log records","text":"Log records are generated and made available for continuous monitoring.","common_control":"logging","accountable_role":"it_ops"},{"id":"csf-rs-ma-01","regulation_id":"nist-csf","control_id":"RS.MA-01","family":"Respond (RS)","title":"Incident response plan is executed","text":"The incident response plan is executed in coordination with relevant third parties once an incident is declared.","common_control":"incident-response","accountable_role":"ciso"},{"id":"gdpr-5-1-e","regulation_id":"gdpr","control_id":"Art. 5(1)(e)","family":"Chapter II Principles","title":"Storage limitation","text":"Personal data shall be... kept in a form which permits identification of data subjects for no longer than is necessary for the purposes for which the personal data are processed.","common_control":"retention","accountable_role":"dpo"},{"id":"gdpr-5-1-f","regulation_id":"gdpr","control_id":"Art. 5(1)(f)","family":"Chapter II Principles","title":"Integrity and confidentiality","plain_title":"Keep personal data secure","plain_summary":"Personal data must be protected against unauthorized use, loss, and damage with suitable technical and organizational measures.\n","text":"Personal data shall be... processed in a manner that ensures appropriate security of the personal data, including protection against unauthorised or unlawful processing and against accidental loss, destruction or damage, using appropriate technical or organisational measures.","topics":["data-protection"],"accountable_role":"dpo"},{"id":"gdpr-15","regulation_id":"gdpr","control_id":"Art. 15","family":"Chapter III Rights of the data subject","title":"Right of access by the data subject","plain_title":"Let people see the data we hold about them","plain_summary":"When someone asks, we must confirm whether we hold personal data about them and give them a copy, generally within one month.\n","text":"The data subject shall have the right to obtain from the controller confirmation as to whether or not personal data concerning him or her are being processed, and, where that is the case, access to the personal data...","topics":["personal-info"],"accountable_role":"dpo"},{"id":"gdpr-17","regulation_id":"gdpr","control_id":"Art. 17","family":"Chapter III Rights of the data subject","title":"Right to erasure","text":"The data subject shall have the right to obtain from the controller the erasure of personal data concerning him or her without undue delay...","common_control":"retention","accountable_role":"dpo"},{"id":"gdpr-28-1","regulation_id":"gdpr","control_id":"Art. 28(1)","family":"Chapter IV Controller and processor","title":"Using processors","text":"Where processing is to be carried out on behalf of a controller, the controller shall use only processors providing sufficient guarantees to implement appropriate technical and organisational measures in such a manner that processing will meet the requirements of this Regulation and ensure the protection of the rights of the data subject.","common_control":"vendor-risk","accountable_role":"dpo"},{"id":"gdpr-30","regulation_id":"gdpr","control_id":"Art. 30(1)","family":"Chapter IV Controller and processor","title":"Records of processing activities","plain_title":"Keep a record of how we use personal data","plain_summary":"We must keep an up-to-date list of the personal data we process, why, who it is shared with, and how long it is kept.\n","text":"Each controller and, where applicable, the controller's representative, shall maintain a record of processing activities under its responsibility.","topics":["personal-info"],"accountable_role":"dpo"},{"id":"gdpr-32-1-a","regulation_id":"gdpr","control_id":"Art. 32(1)(a)","family":"Chapter IV Controller and processor","title":"Security of processing, encryption","text":"...the controller and the processor shall implement appropriate technical and organisational measures to ensure a level of security appropriate to the risk, including inter alia as appropriate: (a) the pseudonymisation and encryption of personal data;","common_control":"encryption","accountable_role":"dpo"},{"id":"gdpr-33-1","regulation_id":"gdpr","control_id":"Art. 33(1)","family":"Chapter IV Controller and processor","title":"Notifying the supervisory authority of a breach","text":"In the case of a personal data breach, the controller shall without undue delay and, where feasible, not later than 72 hours after having become aware of it, notify the personal data breach to the supervisory authority competent in accordance with Article 55, unless the personal data breach is unlikely to result in a risk to the rights and freedoms of natural persons.","common_control":"breach-notification","accountable_role":"dpo"},{"id":"gdpr-34-1","regulation_id":"gdpr","control_id":"Art. 34(1)","family":"Chapter IV Controller and processor","title":"Communicating a breach to the people affected","text":"When the personal data breach is likely to result in a high risk to the rights and freedoms of natural persons, the controller shall communicate the personal data breach to the data subject without undue delay.","common_control":"breach-notification","accountable_role":"dpo"},{"id":"sec-8k-105","regulation_id":"sec-cyber","control_id":"Form 8-K Item 1.05","family":"Incident disclosure","title":"Disclose material cybersecurity incidents","text":"Disclose a cybersecurity incident on Form 8-K within four business days after determining it is material, describing its nature, scope, timing, and material impact.","official_wording":false,"common_control":"breach-notification","accountable_role":"general_counsel"},{"id":"sec-materiality","regulation_id":"sec-cyber","control_id":"Form 8-K Item 1.05 (timing)","family":"Incident disclosure","title":"Decide materiality without unreasonable delay","text":"Determine whether an incident is material without unreasonable delay after discovering it.","official_wording":false,"common_control":"breach-notification","accountable_role":"general_counsel"},{"id":"sec-106-b","regulation_id":"sec-cyber","control_id":"Reg. S-K Item 106(b)","family":"Annual report disclosure","title":"Describe risk management and strategy","text":"Describe in the annual report the processes for assessing, identifying, and managing material risks from cybersecurity threats.","official_wording":false,"common_control":"risk-management","accountable_role":"general_counsel"},{"id":"sec-106-c","regulation_id":"sec-cyber","control_id":"Reg. S-K Item 106(c)","family":"Annual report disclosure","title":"Describe governance and board oversight","text":"Describe in the annual report the board's oversight of cybersecurity risk and management's role in assessing and managing it.","official_wording":false,"common_control":"leadership","accountable_role":"general_counsel"}],"mappings":[{"obligation_id":"soc2-cc6-2","status":"verified","documents":[{"document_id":"POL-002"},{"document_id":"PRC-004"},{"document_id":"EVD-001"}],"last_reviewed":"2026-07-10"},{"obligation_id":"iso-a-5-18","status":"verified","documents":[{"document_id":"POL-002"},{"document_id":"PRC-004"},{"document_id":"EVD-001"}],"last_reviewed":"2026-07-10"},{"obligation_id":"csf-pr-aa-01","status":"verified","documents":[{"document_id":"POL-002"},{"document_id":"STD-003"}],"last_reviewed":"2026-07-10"},{"obligation_id":"soc2-cc6-3","status":"deviations_noted","documents":[{"document_id":"POL-002"}],"rationale":"The policy requires least privilege, but no procedure says how administrator access is approved or reviewed.","last_reviewed":"2026-02-02"},{"obligation_id":"iso-a-8-2","status":"deviations_noted","documents":[{"document_id":"POL-002"}],"rationale":"The policy requires least privilege, but no procedure says how administrator access is approved or reviewed.","last_reviewed":"2026-02-02"},{"obligation_id":"csf-pr-aa-05","status":"deviations_noted","documents":[{"document_id":"POL-002"},{"document_id":"PRC-004"}],"rationale":"Access reviews cover standard accounts. Separation of duties is not yet defined for finance systems.","last_reviewed":"2026-02-02"},{"obligation_id":"soc2-cc6-1","status":"verified","documents":[{"document_id":"POL-002"},{"document_id":"STD-003"}],"last_reviewed":"2025-06-15"},{"obligation_id":"iso-a-8-5","status":"verified","documents":[{"document_id":"STD-003"}],"last_reviewed":"2025-06-15"},{"obligation_id":"csf-pr-aa-03","status":"verified","documents":[{"document_id":"STD-003"}],"last_reviewed":"2025-06-15"},{"obligation_id":"iso-a-8-24","status":"verified","documents":[{"document_id":"POL-001"},{"document_id":"STD-001"}],"last_reviewed":"2026-03-20"},{"obligation_id":"csf-pr-ds-01","status":"verified","documents":[{"document_id":"STD-001"}],"last_reviewed":"2026-03-20"},{"obligation_id":"csf-pr-ds-02","status":"verified","documents":[{"document_id":"STD-001"}],"last_reviewed":"2026-03-20"},{"obligation_id":"gdpr-32-1-a","status":"verified","documents":[{"document_id":"POL-003"},{"document_id":"STD-001"}],"last_reviewed":"2026-03-20"},{"obligation_id":"soc2-cc6-7","status":"verified","documents":[{"document_id":"STD-001"}],"last_reviewed":"2026-03-20"},{"obligation_id":"gdpr-5-1-f","status":"verified","documents":[{"document_id":"POL-003"},{"document_id":"STD-001"}],"last_reviewed":"2026-03-20"},{"obligation_id":"iso-a-8-15","status":"deviations_noted","documents":[{"document_id":"STD-002"}],"rationale":"The standard defines what to log, but no retention period for logs has been set.","last_reviewed":"2026-05-06"},{"obligation_id":"csf-pr-ps-04","status":"deviations_noted","documents":[{"document_id":"STD-002"}],"rationale":"The standard defines what to log, but no retention period for logs has been set.","last_reviewed":"2026-05-06"},{"obligation_id":"iso-a-5-24","status":"verified","documents":[{"document_id":"PRC-001"},{"document_id":"EVD-002"}],"last_reviewed":"2026-05-20"},{"obligation_id":"csf-rs-ma-01","status":"verified","documents":[{"document_id":"PRC-001"},{"document_id":"EVD-002"}],"last_reviewed":"2026-05-20"},{"obligation_id":"soc2-cc7-4","status":"verified","documents":[{"document_id":"PRC-001"}],"last_reviewed":"2026-05-20"},{"obligation_id":"gdpr-33-1","status":"verified","documents":[{"document_id":"PRC-001"},{"document_id":"PRC-002"}],"last_reviewed":"2026-02-12"},{"obligation_id":"gdpr-34-1","status":"deviations_noted","documents":[{"document_id":"PRC-002"}],"rationale":"The procedure covers notifying the regulator. Who approves the message to affected people, and how it is sent, is not defined.","last_reviewed":"2026-02-12"},{"obligation_id":"sec-8k-105","status":"verification_pending","rationale":"No documented process for deciding and filing SEC incident disclosures. PRC-005 is being drafted to cover it.","last_reviewed":"2026-03-10"},{"obligation_id":"sec-materiality","status":"verification_pending","rationale":"No documented process for deciding and filing SEC incident disclosures. PRC-005 is being drafted to cover it.","last_reviewed":"2026-03-10"},{"obligation_id":"iso-a-5-19","status":"verified","documents":[{"document_id":"PRC-003"},{"document_id":"EVD-003"}],"last_reviewed":"2026-08-29"},{"obligation_id":"soc2-cc9-2","status":"verified","documents":[{"document_id":"PRC-003"},{"document_id":"EVD-003"}],"last_reviewed":"2026-08-29"},{"obligation_id":"csf-gv-sc-07","status":"deviations_noted","documents":[{"document_id":"PRC-003"}],"rationale":"Suppliers are reviewed before signing, but the procedure does not require repeat reviews during the contract.","last_reviewed":"2026-08-29"},{"obligation_id":"gdpr-28-1","status":"verified","documents":[{"document_id":"POL-003"},{"document_id":"PRC-003"}],"last_reviewed":"2026-08-29"},{"obligation_id":"gdpr-15","status":"deviations_noted","documents":[{"document_id":"POL-003"}],"rationale":"The policy commits to answering access requests. There is no procedure for verifying identity or meeting the one-month deadline.","last_reviewed":"2026-02-12"},{"obligation_id":"gdpr-30","status":"verification_pending","rationale":"No record of processing activities exists yet.","last_reviewed":"2026-02-12"},{"obligation_id":"gdpr-5-1-e","status":"deviations_noted","documents":[{"document_id":"POL-004"}],"rationale":"Retention periods are set for customer data but not for employee or marketing data.","last_reviewed":"2025-04-30"},{"obligation_id":"iso-a-8-10","status":"verified","documents":[{"document_id":"POL-004"}],"last_reviewed":"2025-04-30"},{"obligation_id":"sec-106-b","status":"verified","documents":[{"document_id":"POL-001"}],"last_reviewed":"2026-01-20"},{"obligation_id":"iso-6-1-2","status":"verified","documents":[{"document_id":"POL-001"}],"last_reviewed":"2026-01-20"},{"obligation_id":"soc2-cc3-2","status":"verified","documents":[{"document_id":"POL-001"}],"last_reviewed":"2026-01-20"},{"obligation_id":"sec-106-c","status":"verified","documents":[{"document_id":"POL-005"}],"last_reviewed":"2026-03-02"},{"obligation_id":"csf-gv-rr-01","status":"verified","documents":[{"document_id":"POL-005"}],"last_reviewed":"2026-03-02"},{"obligation_id":"iso-5-1","status":"verified","documents":[{"document_id":"POL-001"},{"document_id":"POL-005"}],"last_reviewed":"2026-03-02"},{"obligation_id":"soc2-cc1-2","status":"verified","documents":[{"document_id":"POL-005"}],"last_reviewed":"2026-03-02"}],"glossary":[{"term":"Personal data","definition":"Any information about an identifiable person, such as a name, email address, location, or account ID."},{"term":"Controller","definition":"Under GDPR, the organization that decides why and how personal data is used."},{"term":"Processor","aliases":["processors"],"definition":"Under GDPR, an organization that handles personal data on behalf of a controller, such as a cloud or payroll provider."},{"term":"Supervisory authority","definition":"The government body in an EU country that enforces GDPR, such as a national data protection authority."},{"term":"Material","definition":"Important enough that a reasonable investor would want to know about it. The SEC rule uses this test to decide which incidents must be disclosed."},{"term":"Form 8-K","definition":"A report US public companies file with the SEC to announce significant events between regular reports."},{"term":"MFA","definition":"Multi-factor authentication. Logging in with something you know, such as a password, plus something you have, such as a phone."},{"term":"Least privilege","definition":"Giving each person or program only the access it needs to do its job, and nothing more."},{"term":"Encryption","definition":"Scrambling data so only someone with the right key can read it."},{"term":"Incident","definition":"An event that threatens the security of systems or data, whether or not any harm results."},{"term":"Breach","definition":"An incident where data is actually lost, stolen, changed, or exposed without permission."},{"term":"Attestation","definition":"An independent auditor's formal opinion on whether controls are designed and operating as described. A SOC 2 report is an attestation."},{"term":"Annex A","definition":"The list of 93 security controls at the back of ISO/IEC 27001, grouped into organizational, people, physical, and technological controls."},{"term":"Framework","definition":"A structured set of recommended practices. Frameworks like the NIST CSF are usually voluntary."}],"relationships":[],"build_metadata":{"tool_version":"0.2.0","built_at":"2026-11-17T19:15:15.814Z","data_dir":"data-example"}};

<script>
/*
 * tracemap front end
 *
 * Reads window.TRACEMAP_DATA (embedded at build time) and renders a
 * hash-routed, fully static catalog. No network requests, no storage.
 *
 * Routes
 *   #/                     home
 *   #/topics               topic tiles
 *   #/topic/<id>           one topic
 *   #/regulations          regulation library
 *   #/reg/<id>[/<obl>]     one regulation, optionally with a requirement expanded
 *   #/crosswalk            shared controls across regulations
 *   #/documents            document index
 *   #/doc/<id>             one document and everything it supports
 *   #/timeline             key dates
 *   #/reviews              items past their review date
 *   #/glossary             plain-language definitions
 *   #/search/<query>       search results
 */
(function () {
  'use strict';

  var D = window.TRACEMAP_DATA;
  if (!D) {
    document.getElementById('app').textContent = 'No catalog data was embedded. Rebuild with build.js.';
    return;
  }
  var C = D.catalog || {};
  // Layout settings. build.js always embeds a complete, resolved object (lib/layouts.js).
  var L = C.layouts || {
    index: { tiles: ['topics'], show_applicability_filters: true },
    browse: { default_group_by: C.group_field || 'category', default_sort: 'sequence', show_columns: ['name', 'type', 'key_date', 'coverage'], display_mode: 'list' },
    detail: { panels: [] },
    dashboard: { enabled: false }
  };
  // The facet the library groups by when grouping by category (the first Group by button).
  var GROUP_FIELD = ['date', 'id'].indexOf(L.browse.default_group_by) < 0 ? L.browse.default_group_by : (C.group_field || 'category');

  // Sort a list the way browse views are configured. sequence: items with a sequence first,
  // lowest first; the rest keep file order. name / id: alphabetical.
  function sortItems(list, how, nameOf) {
    var wrapped = list.map(function (x, i) { return { x: x, i: i }; });
    wrapped.sort(function (a, b) {
      if (how === 'name') return nameOf(a.x).localeCompare(nameOf(b.x)) || a.i - b.i;
      if (how === 'id') return String(a.x.id).localeCompare(String(b.x.id)) || a.i - b.i;
      var sa = a.x.sequence, sb = b.x.sequence;
      var ha = typeof sa === 'number', hb = typeof sb === 'number';
      if (ha && hb && sa !== sb) return sa - sb;
      if (ha !== hb) return ha ? -1 : 1;
      return a.i - b.i;
    });
    return wrapped.map(function (w) { return w.x; });
  }

  // ------------------------------------------------------------------
  // Indexes
  // ------------------------------------------------------------------
  function byId(list) {
    var m = {};
    (list || []).forEach(function (x) { m[x.id] = x; });
    return m;
  }
  var REG = byId(D.regulations);
  var DOC = byId(D.documents);
  var TOPIC = byId(D.topics);
  var CTRL = byId(D.controls);
  var OBL = byId(D.obligations);
  var ROLE = byId(D.roles);
  var LAYERS = C.layers || [];
  var LAYER = byId(LAYERS);
  var MAP = {};
  (D.mappings || []).forEach(function (m) { MAP[m.obligation_id] = m; });

  var STATUS_KEYS = ['verified', 'deviations_noted', 'verification_pending', 'not_assessed'];
  var LABEL = {
    verified: 'Verified',
    deviations_noted: 'Deviations noted',
    verification_pending: 'Verification pending',
    not_assessed: 'Not yet assessed'
  };
  Object.keys(C.status_labels || {}).forEach(function (k) { LABEL[k] = C.status_labels[k]; });

  var SOURCE_TYPE_LABEL = { mandate: 'Mandate', guidance: 'Guidance', standard: 'Standard', market: 'Market-based' };
  var OBLIGATION_VERB = {
    compliant_with: 'Must comply with',
    certified_to: 'Certified or attested to',
    aligned_with: 'Aligned with',
    implements: 'Implements',
    context: 'Listed for context only'
  };

  var oblsByReg = {};
  var oblsByCtrl = {};
  var oblsByTopic = {};
  var oblsByDoc = {};
  D.obligations.forEach(function (o) {
    (oblsByReg[o.regulation_id] = oblsByReg[o.regulation_id] || []).push(o);
    if (o.common_control) (oblsByCtrl[o.common_control] = oblsByCtrl[o.common_control] || []).push(o);
    oblTopics(o).forEach(function (t) { (oblsByTopic[t] = oblsByTopic[t] || []).push(o); });
    var m = MAP[o.id];
    if (m) (m.documents || []).forEach(function (e) {
      (oblsByDoc[e.document_id] = oblsByDoc[e.document_id] || []).push(o);
    });
  });

  function oblTopics(o) {
    var t = (o.topics || []).slice();
    if (o.common_control && CTRL[o.common_control] && t.indexOf(CTRL[o.common_control].topic) < 0) {
      t.unshift(CTRL[o.common_control].topic);
    }
    return t;
  }
  function status(o) { return (MAP[o.id] && MAP[o.id].status) || 'not_assessed'; }
  function isContext(r) { return r.obligation_type === 'context'; }

  // ------------------------------------------------------------------
  // Dates and review cadence
  // ------------------------------------------------------------------
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function parseDate(s) {
    if (!s) return null;
    var p = String(s).split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }
  var TODAY = (function () { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); })();
  function fmtDate(s) {
    var d = parseDate(s);
    return d ? MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear() : '';
  }
  function daysUntil(s) {
    var d = parseDate(s);
    return d ? Math.round((d - TODAY) / 86400000) : null;
  }
  function keyDateText(k) { return k.date_text || fmtDate(k.date) || 'Date not set'; }
  function isFutureDate(k) { return k.date ? daysUntil(k.date) >= 0 : !!k.pending; }
  function nextDate(r) {
    var f = (r.key_dates || []).filter(isFutureDate);
    f.sort(function (a, b) { return (a.date || '9999') < (b.date || '9999') ? -1 : 1; });
    return f[0] || null;
  }
  function lastDateText(r) {
    var past = (r.key_dates || []).filter(function (k) { return k.date && !isFutureDate(k); });
    past.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    return past[0] ? past[0].label + ': ' + keyDateText(past[0]) : '';
  }
  function interval(item) { return item.review_interval_days || C.review_interval_days || 365; }
  function isOverdue(item) {
    if (!item || !item.last_reviewed) return false;
    return -daysUntil(item.last_reviewed) > interval(item);
  }

  // ------------------------------------------------------------------
  // State (in memory only)
  // ------------------------------------------------------------------
  var state = {
    applies: {},          // applicability id -> true
    facets: {},           // field -> { value: true }
    groupBy: L.browse.default_group_by === 'date' || L.browse.default_group_by === 'id' ? L.browse.default_group_by : GROUP_FIELD,
    docLayer: 'all'
  };
  function appliesSelected() { return Object.keys(state.applies).filter(function (k) { return state.applies[k]; }); }
  function regApplies(r) {
    var sel = appliesSelected();
    if (!sel.length) return true;
    if (r.applies_if === 'always') return true;
    if (!Array.isArray(r.applies_if)) return false;
    return r.applies_if.some(function (a) { return sel.indexOf(a) >= 0; });
  }
  function applicableRegs() { return D.regulations.filter(regApplies); }

  // ------------------------------------------------------------------
  // Facets
  // ------------------------------------------------------------------
  function facetDefs() {
    var defs = [{ field: 'source_type', label: 'Type', values: SOURCE_TYPE_LABEL }];
    (C.facets || []).forEach(function (f) { defs.push(f); });
    defs.push({ field: '_timing', label: 'Timing', values: { upcoming: 'Upcoming date', in_force: 'In force now' } });
    var sv = {};
    STATUS_KEYS.forEach(function (k) { sv[k] = LABEL[k]; });
    defs.push({ field: '_status', label: 'Has requirements that are', values: sv });
    return defs;
  }
  function regValues(r, field) {
    if (field === '_timing') return nextDate(r) ? ['upcoming'] : ['in_force'];
    if (field === '_status') {
      if (isContext(r)) return [];
      var s = {};
      (oblsByReg[r.id] || []).forEach(function (o) { s[status(o)] = true; });
      if ((r.total_obligations || 0) > (oblsByReg[r.id] || []).length) s.not_assessed = true;
      if (!(oblsByReg[r.id] || []).length) s.not_assessed = true;
      return Object.keys(s);
    }
    var v = r[field];
    if (v == null) return [];
    return Array.isArray(v) ? v : [v];
  }
  function passesFacets(r, skipField) {
    return Object.keys(state.facets).every(function (field) {
      if (field === skipField) return true;
      var sel = Object.keys(state.facets[field]).filter(function (k) { return state.facets[field][k]; });
      if (!sel.length) return true;
      var vals = regValues(r, field);
      return sel.some(function (s) { return vals.indexOf(s) >= 0; });
    });
  }
  function filteredRegs() { return applicableRegs().filter(function (r) { return passesFacets(r); }); }
  function facetLabel(field, value) {
    var f = facetDefs().filter(function (d) { return d.field === field; })[0];
    return (f && f.values[value]) || value;
  }

  // ------------------------------------------------------------------
  // Coverage
  // ------------------------------------------------------------------
  function coverage(list, extraUnlisted) {
    var c = { verified: 0, deviations_noted: 0, verification_pending: 0, not_assessed: 0, total: 0 };
    list.forEach(function (o) { c[status(o)]++; c.total++; });
    if (extraUnlisted > 0) { c.not_assessed += extraUnlisted; c.total += extraUnlisted; }
    return c;
  }
  function regCoverage(r) {
    var listed = oblsByReg[r.id] || [];
    return coverage(listed, Math.max(0, (r.total_obligations || 0) - listed.length));
  }

  // ------------------------------------------------------------------
  // DOM helpers
  // ------------------------------------------------------------------
  function el(tag, attrs) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v == null || v === false) return;
      if (k === 'class') node.className = v;
      else if (k === 'text') node.textContent = v;
      else if (k.slice(0, 2) === 'on') node.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'style') node.setAttribute('style', v);
